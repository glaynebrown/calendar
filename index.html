<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Calendar</title>
<link rel="manifest" href="manifest.json?v=210">
<link rel="icon" href="favicon-32.png?v=210" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calendar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#9BAF94">
<link rel="stylesheet" href="styles.css?v=210">
<link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Nunito:wght@400;500;700&family=Quicksand:wght@400;500;700&family=Poppins:wght@400;500;600&family=Comfortaa:wght@400;500;700&family=Lato:wght@400;700&family=Work+Sans:wght@400;500;700&family=Baloo+2:wght@400;500;700&display=swap">
</head>
<body>

<div id="app">

  <!-- First-run: sign up or sign in -->
  <div id="whoami-screen" class="screen-overlay hidden">
    <div class="whoami-card">
      <h1>Sign in</h1>
      <p class="muted">Enter your login details or create an account.</p>
      <div class="field"><label>Name</label><input type="text" id="signin-name" placeholder="Your name"></div>
      <div class="field"><label>Email</label><input type="text" id="signin-email" placeholder="you@example.com"></div>
      <div class="field"><label>Password</label><input type="password" id="signin-password" placeholder="At least 6 characters"></div>
      <p class="muted" id="signin-error" style="color:var(--text-danger, #c0392b);"></p>
      <button class="btn btn-primary" id="signin-continue" style="width:100%;">Continue</button>
    </div>
  </div>

  <!-- Shown while Firebase Auth's session check + the first Firestore sync
       are in flight -- both are async, unlike the old localStorage reads. -->
  <div id="loading-screen" class="screen-overlay hidden">
    <div class="whoami-card" style="text-align:center;">
      <p class="muted">Loading your calendar…</p>
    </div>
  </div>

  <!-- Calendar tab -->
  <section id="calendar-tab" class="tab-panel">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="hamburger-btn" aria-label="Switch view"><span data-icon="menu"></span></button>
        <button class="icon-btn" id="viewmode-btn" aria-label="Calendar view"><span data-icon="layout"></span></button>
      </div>
      <div class="month-nav">
        <button class="icon-btn" id="prev-month" aria-label="Previous month"><span data-icon="chevron-left"></span></button>
        <button id="month-label" class="month-label" aria-label="Edit month background"></button>
        <button class="icon-btn" id="next-month" aria-label="Next month"><span data-icon="chevron-right"></span></button>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="search-btn" aria-label="Search events"><span data-icon="search"></span></button>
        <button class="icon-btn" id="settings-btn" aria-label="Settings"><span data-icon="gear"></span></button>
      </div>
    </header>

    <div id="view-menu" class="dropdown-menu hidden"></div>
    <div id="viewmode-menu" class="dropdown-menu hidden"></div>
    <div id="search-panel" class="dropdown-menu hidden"></div>

    <div class="weekday-row">
      <span>Sun</span><span>Mon</span><span>Tues</span><span>Wed</span><span>Th</span><span>Fri</span><span>Sat</span>
    </div>

    <div id="calendar-grid" class="calendar-grid"></div>
  </section>

  <!-- To-do tab -->
  <section id="todo-tab" class="tab-panel hidden">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn toggle-checked" id="show-checked-btn" aria-label="Show checked items"><span data-icon="eye"></span></button>
      </div>
      <span class="panel-title">To-do</span>
      <div class="topbar-actions">
        <button class="icon-btn" id="todo-settings-btn" aria-label="Settings"><span data-icon="gear"></span></button>
      </div>
    </header>
    <div id="notes-list" class="notes-list"></div>
  </section>

  <nav class="bottom-tabs">
    <button class="bottom-tab active" data-tab="calendar-tab"><span data-icon="calendar"></span><span>Calendar</span></button>
    <button id="fab" class="fab" aria-label="Add"><span data-icon="plus"></span></button>
    <button class="bottom-tab" data-tab="todo-tab"><span data-icon="notes"></span><span>To-do</span></button>
  </nav>

</div>

<!-- Modals mount point -->
<div id="modal-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<script src="firebase-config.js?v=210"></script>
<script src="icons.js?v=210"></script>
<script src="store.js?v=210"></script>
<script src="timepicker.js?v=210"></script>
<script src="calendar.js?v=210"></script>
<script src="datepicker.js?v=210"></script>
<script src="todo.js?v=210"></script>
<script src="settings.js?v=210"></script>
<script src="main.js?v=210"></script>
</body>
</html>
